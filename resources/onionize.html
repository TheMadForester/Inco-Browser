<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Onionize</title>
<link rel="stylesheet" href="inco.css">
<style>
  html, body { height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  .card { min-width: 280px; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
  .card .section-title { margin: 0; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--amber);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.9); }
    50% { opacity: 1; transform: scale(1.15); }
  }
</style>
</head>
<body>
<section class="card rise">
  <h2 class="section-title">Onionize</h2>
  <div><span class="chip amber"><span class="dot"></span><span data-i18n="switching">Switching…</span></span></div>
  <p class="row-desc" style="margin:0" data-i18n="switching.d">Opening a separate window that starts the verified bundled Tor.</p>
</section>
<script>
const T = {
  en: { "switching": "Switching…", "switching.d": "Opening a separate window that starts the verified bundled Tor." },
  de: { "switching": "Wechsle…", "switching.d": "Öffnet ein separates Fenster, das das geprüfte gebündelte Tor startet." },
  fr: { "switching": "Changement…", "switching.d": "Ouverture d’une fenêtre séparée qui lance le Tor intégré vérifié." },
  it: { "switching": "Cambio…", "switching.d": "Apertura di una finestra separata che avvia il Tor incluso verificato." },
  zh: { "switching": "切换中…", "switching.d": "正在打开一个单独窗口，并启动经过验证的捆绑 Tor。" }
};
function applyLang(lang) {
  const code = T[lang] ? lang : "en";
  const t = T[code];
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (t[k]) el.textContent = t[k];
  });
}
window.incoApplyLang = applyLang;
</script>
</body>
</html>
